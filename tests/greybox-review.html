<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Greybox — Cemitério</title><link rel="stylesheet" href="../style.css"><style>body{overflow:auto;justify-content:flex-start;padding:12px}canvas{width:min(1100px,96vw,calc((100vh - 160px)*16/9));height:auto;flex-shrink:0}button,select{padding:8px;background:#293139;color:#dfd1b5}pre{white-space:pre-wrap}</style><body><canvas id="game" width="960" height="540" tabindex="0"></canvas><div><select id="room" aria-label="Sala"></select><select id="target" aria-label="Parede"></select><select id="exit" aria-label="Conexão"></select><button id="inspect-exit">Inspecionar conexão</button><button id="walk-left">Andar ←</button><button id="walk-right">Andar →</button><button id="hit-wall">Impacto QA</button><button id="wall">Inspecionar parede</button><button id="pause">Pausar / continuar</button><button id="auto">Travessia completa 2×</button><button id="load">Inspecionar sala</button><button id="landmark">Inspecionar objeto</button><button id="lift">Testar alavanca</button><button id="grey">Greybox / arte</button><button id="collision">Colisões</button><button id="climb">Subida completa da Sala 4</button><button id="overview">Visão geral / câmera</button></div><pre id="status"></pre><script type="module">
import{GreyboxDriver}from'./greybox-driver.js';import{navigation,input as controls}from'./greybox-navigation.js';
import{RoomManager}from'../src/world/room-manager.js';import{Camera}from'../src/core/camera.js';import{Input}from'../src/core/input.js';import{Background}from'../src/world/background.js';import{DemoView}from'../src/ui/demo-view.js';import{loadWorldArt}from'../src/ui/world-art.js';import{loadPlayerSprites,PlayerSpriteView}from'../src/ui/player-sprites.js';import{drawCemetery}from'../src/ui/cemetery-view.js';
const w=new RoomManager(new Camera(320,180)),input=new Input(),art=await loadWorldArt(),pv=new PlayerSpriteView(await loadPlayerSprites()),view=new DemoView(new Background(480,270),pv,art),canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),select=document.getElementById('room');let paused=false,collisions=false,grey=false,overview=false,last=0,acc=0,bot=null;let walkTime=0,walkDirection=0;
for(const r of Object.values(w.rooms)){const o=document.createElement('option');o.value=r.id;o.textContent=r.number+' — '+r.name;select.append(o);}w.phase='playing';
const targetSelect=document.getElementById('target');
const wallsFor=r=>[...(r.breakables||[]).filter(b=>b.kind!=='pile'),...r.exits.filter(e=>e.flag).map(e=>({...e,id:e.flag,door:true}))];
function listWalls(){targetSelect.replaceChildren();for(const b of wallsFor(w.rooms[select.value])){const o=document.createElement('option');o.value=b.id;o.textContent=b.id;targetSelect.append(o);}}
const exitSelect=document.getElementById('exit');
function listExits(){exitSelect.replaceChildren();for(const [i,e]of w.rooms[select.value].exits.entries()){const o=document.createElement('option');o.value=i;o.textContent=e.to+' · '+e.passageType+' · '+e.side;exitSelect.append(o);}}
select.onchange=()=>{listWalls();listExits();};listWalls();listExits();
document.getElementById('inspect-exit').onclick=()=>{bot=null;paused=true;const r=w.rooms[select.value],e=r.exits[Number(exitSelect.value)];w.load(r.id,r.entries[e.connection+':'+r.id]);w.phase='playing';};
document.getElementById('wall').onclick=()=>{bot=null;paused=false;const r=w.rooms[select.value],b=wallsFor(r).find(b=>b.id===targetSelect.value);if(b){const direction=b.door?b.direction:(r.id==='watch'?1:-1);w.load(r.id,{x:b.x-direction*(direction>0?16:24),y:b.y,facing:direction});w.phase='playing';canvas.focus();}};document.getElementById('walk-left').onclick=()=>{walkTime=.65;walkDirection=-1;canvas.focus();};document.getElementById('walk-right').onclick=()=>{walkTime=.65;walkDirection=1;canvas.focus();};document.getElementById('hit-wall').onclick=()=>{w.levelEvents.targets.find(b=>b.id===targetSelect.value)?.takeHit();canvas.focus();};document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('auto').onclick=()=>{w.restart();bot=new GreyboxDriver();overview=false;};
document.getElementById('load').onclick=()=>{bot=null;w.load(select.value,w.rooms[select.value].spawn);w.phase='playing';canvas.focus();};document.getElementById('landmark').onclick=()=>{bot=null;const r=w.rooms[select.value],point=r.sealedGate||r.chest||r.lever||r.cache||r.breakables?.find(b=>b.kind==='pile')||r.checkpoint||r.spawn;w.load(r.id,{x:point.x+(r.lever?-24:30),y:point.y});w.phase='playing';};document.getElementById('lift').onclick=()=>w.flags.add('liftLever');document.getElementById('grey').onclick=()=>grey=!grey;document.getElementById('overview').onclick=()=>overview=!overview;
document.getElementById('collision').onclick=()=>collisions=!collisions;
document.getElementById('climb').onclick=()=>{w.restart();w.phase='playing';w.load('watch',w.rooms.watch.entries['watch:bridge:main:watch']);paused=false;overview=false;const driver=new GreyboxDriver();driver.nav=navigation(w.map);bot={next(world){if(world.room.id!=='watch')return controls(0,false,false);driver.frame++;const k=controls();k.held={};k.pressed={};const action=driver.navigate(world,world.room.exits.find(e=>e.to==='crossroads'),k);if(world.enemies.some(e=>!e.dead&&Math.abs(e.x-world.player.x)<65&&Math.abs(e.y-world.player.y)<32)){action.pressed.attackLight=driver.frame%20===1;action.pressed.attackM2=driver.frame%20===11;}return action;}};};
function frame(t){acc+=Math.min(.1,(t-last)/1000)*(bot?2:1);last=t;while(acc>=1/60){input.beginFrame();if(!paused){if(walkTime>0){walkTime-=1/60;input.held.left=walkDirection<0;input.held.right=walkDirection>0;}w.update(1/60,bot?bot.next(w):input);view.update(1/60,w);}acc-=1/60;}ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
 if(grey){ctx.fillStyle='#10151c';ctx.fillRect(0,0,480,270);ctx.save();const scale=overview?Math.min(460/w.map.width,240/w.map.height):1.5;ctx.scale(scale,scale);if(!overview)ctx.translate(-w.camera.ox,-w.camera.oy);w.map.draw(ctx,overview?{ox:0,oy:0}:w.camera,overview?w.map.width:320,overview?w.map.height:180);drawCemetery(ctx,w,null,true);w.player.draw(ctx,0);for(const e of w.enemies)e.draw(ctx);if(w.boss)w.boss.draw(ctx);ctx.restore();}else if(overview){const snapshot=Object.create(w);snapshot.camera={ox:0,oy:0,w:w.map.width,h:w.map.height};const z=view.zoom;view.zoom=Math.min(480/w.map.width,270/w.map.height);view.draw(ctx,snapshot,t/1000,{hitboxes:collisions});view.zoom=z;}else view.draw(ctx,w,t/1000,{hitboxes:collisions});
 document.getElementById('status').textContent=`${w.phase} · ${w.elapsed.toFixed(1)}s · ${w.deaths} mortes · ${w.visited.size}/10 salas | ${w.room.number}: ${w.room.name} | ${w.player.x.toFixed(0)}, ${w.player.y.toFixed(0)} | vida ${w.health.skulls} | arena ${w.levelEvents.arena.phase} | alavanca ${w.flags.has('liftLever')} | boss ${w.boss?.state??'-'}\n${w.context} · Paredes: ${w.levelEvents.targets.filter(b=>b.kind!=='pile').map(b=>b.id+':'+(b.dead?'broken':w.levelEvents.damage.get(b.id)?'damaged':'intact')).join(', ')} · A/D, Espaço, Shift, J/U, E; Plataformas sólidas. Inspeção por sala não é uma travessia completa.`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
