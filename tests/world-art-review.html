<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão de arte — Cemitério</title><link rel="stylesheet" href="../style.css">
<style>body{justify-content:start;padding:12px;overflow:auto}canvas{width:960px;max-width:95vw;height:auto}select,button{padding:8px;background:#202c34;color:#e1d3ae;border:1px solid #7c785d}#tools{display:flex;gap:12px}#status{font-size:12px;color:#cfbd96}#gallery{display:grid;grid-template-columns:repeat(8,128px);gap:5px}figure{margin:0;background:#101a24}figure img{width:128px;height:128px;object-fit:contain;image-rendering:pixelated}figcaption{font-size:10px}</style>
<body><div id="tools"><label>Sala <select id="room"></select></label><label>Enquadramento <select id="position"><option value="start">Entrada</option><option value="middle">Centro</option><option value="end">Saída</option></select></label><button id="locks">Alternar acessos</button><label>Chefe <select id="boss"><option value="idle">Repouso</option><option value="slash-windup">Preparar corte</option><option value="slash-active">Cortar</option><option value="charge-windup">Preparar investida</option><option value="charge-active">Investir</option><option value="slam-windup">Preparar queda</option><option value="slam-active">Saltar</option><option value="recovery">Recuperação</option><option value="death">Morte</option></select></label></div>
<canvas width="480" height="270" id="game"></canvas><div id="status">Carregando arte…</div><div id="gallery"></div>
<script type="module">
import{RoomManager}from'../src/world/room-manager.js';import{Camera}from'../src/core/camera.js';import{Background}from'../src/world/background.js';import{DemoView,WORLD_ZOOM}from'../src/ui/demo-view.js';import{loadPlayerSprites,PlayerSpriteView}from'../src/ui/player-sprites.js';import{loadWorldArt}from'../src/ui/world-art.js';
const art=await loadWorldArt(),player=new PlayerSpriteView(await loadPlayerSprites()),w=new RoomManager(new Camera(480/WORLD_ZOOM,270/WORLD_ZOOM)),view=new DemoView(new Background(480,270),player,art),ctx=document.querySelector('canvas').getContext('2d');
const rooms=document.querySelector('#room'),pos=document.querySelector('#position'),boss=document.querySelector('#boss');
for(const r of Object.values(w.rooms)){const o=document.createElement('option');o.value=r.id;o.textContent=r.name;rooms.append(o);}
function show(){const r=w.rooms[rooms.value];w.load(r.id,r.spawn||Object.values(r.entries)[0]);w.phase='playing';w.noticeTimer=0;if(pos.value!=='start'){w.player.x=pos.value==='middle'?w.map.width*.5:w.map.width-64;w.player.y=(w.map.rows-2)*16;w.camera.snapTo(w.player,w.map);}if(w.boss){w.boss.state='approach';w.boss.phase=2;w.boss.dead=false;w.boss.deathTimer=.4;w.boss.x=w.player.x+90;w.boss.slamX=w.player.x;const state=boss.value;w.boss.hitbox=null;art.animator.actors.set(w.boss,{state:state.replace(/-/g,''),time:0,x:w.boss.x});if(state==='death'){w.boss.dead=true;}else if(state.includes('-')){const[a,b]=state.split('-');w.boss.attack=a;w.boss.state=b;}else w.boss.state=state;}player.update(1/60,w);document.querySelector('#status').textContent=art.manifest.status+' · '+Object.keys(art.manifest.assets).length+' sprites · '+Object.keys(art.backgrounds).length+' fundos · sala '+r.id;}
rooms.onchange=show;pos.onchange=show;boss.onchange=show;document.querySelector('#locks').onclick=()=>{for(const f of ['cemeteryKey','cemeteryDoor','mainGateLever','shortcutWest','shortcutGallery','shortcutDeep','secretChapel'])w.flags.has(f)?w.flags.delete(f):w.flags.add(f);};
for(const[name,a]of Object.entries(art.manifest.assets)){const f=document.createElement('figure'),img=new Image(),caption=document.createElement('figcaption');img.src=a.image.src;caption.textContent=name;f.append(img,caption);document.querySelector('#gallery').append(f);}
show();function frame(t){w.health.invulnTimer=0;art.time=t/1000;view.draw(ctx,w,t/1000,{hitboxes:false,map:false});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
