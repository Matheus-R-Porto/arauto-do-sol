<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Auditoria de cenário</title>
<style>body{background:#0b1017;color:#ded5c4;font:14px monospace}button,select{padding:8px;background:#28303b;color:inherit}canvas,img{image-rendering:pixelated}#live{width:480px;max-width:95vw}#selected{display:block;width:960px;max-width:95vw}#thumbs{display:flex;flex-wrap:wrap;gap:8px}#thumbs button{width:240px}#thumbs img{width:220px}pre{white-space:pre-wrap}#live{width:240px}#thumbs{display:block;width:245px;height:58vh;overflow:auto}#caption{position:fixed;left:270px;top:65px;font-size:14px}#selected{position:fixed;left:270px;top:110px;width:calc(100vw - 285px);max-width:960px}body{overflow:hidden}</style>
<label>Versão <select id="version"><option value="before">Antes</option><option value="current">Atual</option></select></label><button id="start">Percorrer 17 salas</button><label><input id="boxes" type="checkbox">Hitboxes</label><button id="pause">Pausar / continuar</button>
<p id="status">Carregando</p><canvas id="live" width="1920" height="1080"></canvas><h2 id="caption">Sala selecionada</h2><img id="selected" alt="Captura da sala durante gameplay"><div id="thumbs"></div>
<script type="module">
import{RoomManager}from'../src/world/room-manager.js';import{Camera}from'../src/core/camera.js';import{Background}from'../src/world/background.js';import{DemoView,WORLD_ZOOM}from'../src/ui/demo-view.js';import{loadPlayerSprites,PlayerSpriteView}from'../src/ui/player-sprites.js';import{loadWorldArt}from'../src/ui/world-art.js';import{PlaythroughDriver}from'./playthrough-driver.js';
const el=id=>document.getElementById(id),ctx=el('live').getContext('2d'),sprites=await loadPlayerSprites();ctx.setTransform(4,0,0,4,0,0);let w,view,bot,run=false,last=0,acc=0,art;const captures=new Map();
el('version').value=new URLSearchParams(location.search).get('version')||'before';
async function setup(){run=false;art=await loadWorldArt(el('version').value==='before'?'/docs/scenery/before-manifest.json':'/assets/sprites/world/manifest.json');w=new RoomManager(new Camera(480/WORLD_ZOOM,270/WORLD_ZOOM));view=new DemoView(new Background(480,270),new PlayerSpriteView(sprites),art);bot=new PlaythroughDriver({mode:'completionist',exerciseDeaths:true});captures.clear();el('thumbs').replaceChildren();el('status').textContent='Pronto para percorrer';acc=0;}
el('version').onchange=setup;el('start').onclick=async()=>{await setup();run=true;};el('pause').onclick=()=>run=!run;
function capture(){if(w.phase!=='playing'||w.transition||w.hitstop>0||w.health.dead)return;const r=w.room,id=r.id,target=r.landmark==='statue'?350:Math.min(w.map.width*.55,440),score=Math.abs((w.camera.ox+w.camera.w/2)-target);const prev=captures.get(id);if(prev&&score>=prev.score-24)return;const url=el('live').toDataURL('image/png');let button=prev?.button;if(!button){button=document.createElement('button');button.id='room-'+id;button.onclick=()=>{el('selected').src=captures.get(id).url;el('caption').textContent=r.name+' · '+el('version').value;};el('thumbs').append(button);}button.replaceChildren();const im=new Image();im.src=url;button.append(im,document.createTextNode(r.name));captures.set(id,{score,url,button});}
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(w){if(run){acc+=dt*24;while(acc>=1/60&&w.phase!=='finished'){w.update(1/60,bot.next(w));view.update(1/60,w);acc-=1/60;}if(w.phase==='finished')run=false;}view.draw(ctx,w,t/1000,{hitboxes:el('boxes').checked,map:false});if(run)capture();el('status').textContent=`${run?'EM EXECUÇÃO':'PAUSADO'} · ${w.phase} · ${w.room.id} · ${w.elapsed.toFixed(1)}s · ${w.visited.size}/17 salas · ${captures.size}/17 capturas · ${w.deaths} mortes · ${w.collected.size}/4 fragmentos`;}
requestAnimationFrame(frame);}await setup();requestAnimationFrame(frame);
</script></html>
