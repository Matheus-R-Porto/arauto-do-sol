<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Animações · revisão nativa</title>
<style>body{background:#090d13;color:#d9d0b9;font:14px monospace}canvas,img{image-rendering:pixelated}button,select{padding:7px;background:#26303a;color:inherit}canvas{display:block;margin:12px 0}#proof{display:block}</style>
<label>Entidade <select id="actor"><option>player</option><option>walker</option><option>lunger</option><option>ranged</option><option>boss</option></select></label>
<label>Animação <select id="clip"></select></label><button id="flip">Espelhar</button><button id="pause">Pausar</button><button id="step">Próximo quadro</button><label><input type="checkbox" id="hit" checked>Hitbox</label>
<button id="retreat">Testar recuo real do Ranged</button>
<canvas width="480" height="270"></canvas><p id="status">Carregando</p><img id="proof" alt="Todos os quadros em tamanho nativo">
<script type="module">
import{RoomManager}from'../src/world/room-manager.js';import{Camera}from'../src/core/camera.js';import{Background}from'../src/world/background.js';import{DemoView}from'../src/ui/demo-view.js';import{loadPlayerSprites,PlayerSpriteView}from'../src/ui/player-sprites.js';import{loadWorldArt}from'../src/ui/world-art.js';import{Enemy}from'../src/entities/enemies/enemy.js';import{CemeteryGuardian}from'../src/entities/boss/guardian.js';import{duration}from'../src/ui/animation-time.js';
const art=await loadWorldArt(),p=new PlayerSpriteView(await loadPlayerSprites()),w=new RoomManager(new Camera(480,270)),view=new DemoView(new Background(480,270),p,art,1),ctx=document.querySelector('canvas').getContext('2d'),actor=document.querySelector('#actor'),clip=document.querySelector('#clip');
ctx.canvas.width=1920;ctx.canvas.height=1080;ctx.canvas.style.width='960px';ctx.canvas.style.maxWidth='95vw';ctx.canvas.style.height='auto';ctx.setTransform(4,0,0,4,0,0);
let time=0,last=0,paused=false,entity,sets,realMotion=false,probeTime=0,probeStart=0;const probeFrames=new Set();
function setup(){realMotion=false;w.load(actor.value==='boss'?'guardian':'passage', {x:180,y:352});w.phase='playing';w.health.invulnTimer=0;w.player.y=actor.value==='boss'?288:352;w.state.enemies=[];w.state.boss=null;w.camera.snapTo(w.player,w.map);entity=actor.value==='player'?w.player:actor.value==='boss'?new CemeteryGuardian(230,288):new Enemy({type:actor.value,x:230,y:352});if(actor.value==='boss')w.state.boss=entity;else if(actor.value!=='player')w.state.enemies=[entity];sets=actor.value==='player'?p.manifest.animations:art.manifest.animations?.[actor.value]||{};clip.replaceChildren();for(const name of Object.keys(sets)){const o=document.createElement('option');o.textContent=name;clip.append(o);}time=0;document.querySelector('#proof').src='/docs/animations-v2/'+actor.value+'-native.png';}
actor.onchange=setup;clip.onchange=()=>time=0;document.querySelector('#flip').onclick=()=>entity.facing*=-1;document.querySelector('#pause').onclick=()=>paused=!paused;document.querySelector('#step').onclick=()=>{paused=true;const a=sets[clip.value];let t=0;for(const f of a.frames){t+=f.duration;if(t>time+.001){time=t+.00001;break;}}};
document.querySelector('#retreat').onclick=()=>{actor.value='ranged';setup();entity.x=350;entity.home=350;w.player.x=400;w.player.y=352;w.camera.snapTo(w.player,w.map);probeStart=entity.x;probeTime=0;probeFrames.clear();realMotion=true;};setup();function draw(t){if(realMotion){if(probeTime<.85){const input={held:{},pressed:{},released:{},moveX:0};w.update(1/60,input);view.update(1/60,w);probeTime+=1/60;const f=art.animator.sample(entity,sets);if(art.animator.actors.get(entity)?.state==='walk')probeFrames.add(f.file);}view.draw(ctx,w,t/1000,{hitboxes:true,map:false});document.querySelector('#status').textContent='AI real: '+entity.state+' · deslocamento '+(entity.x-probeStart).toFixed(2)+' px · '+probeFrames.size+'/4 quadros de recuo observados · '+probeTime.toFixed(2)+' s';requestAnimationFrame(draw);return;}if(!paused)time+=Math.min(.05,(t-last)/1000);last=t;const a=sets[clip.value];if(a){const elapsed=time%(duration(a)+.35);if(actor.value==='player'){p.animator.state=clip.value;p.animator.time=elapsed;}else{entity.state=clip.value.includes('-')?clip.value.split('-').at(-1):clip.value;entity.dead=clip.value==='death';entity.deathTimer=.4;entity.attack=actor.value==='boss'?(clip.value.split('-')[0]):undefined;art.animator.actors.set(entity,{state:clip.value.endsWith('-recovery')?'recovery':clip.value.replaceAll('-',''),time:elapsed,x:entity.x});}document.querySelector('#status').textContent=actor.value+' · '+clip.value+' · '+a.frames.length+' quadros · '+duration(a).toFixed(3)+' s · '+(a.loop?'loop':'1× e hold')+' · resolução nativa';}view.draw(ctx,w,t/1000,{hitboxes:document.querySelector('#hit').checked,map:false});requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
